<!doctype html><html lang="en" data-theme="dark"><head><meta charset=utf-8>
<title>Poly Bench</title><meta name=viewport content="width=device-width,initial-scale=1"></head><body>

<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --bg:#E8EBED; --panel:rgba(255,255,255,.86); --panel-solid:#FFFFFF;
  --line:rgba(20,30,36,.16); --line-strong:rgba(20,30,36,.32);
  --text:#12191D; --muted:#576870;
  --sel:#A8620B; --sel-hot:#C4780F;
  --axX:#C0392B; --axY:#3B8A1C; --axZ:#2A6FB5;
  --shadow:0 1px 2px rgba(10,20,26,.10), 0 10px 26px rgba(10,20,26,.10);
  --vp-top:#F1F4F5; --vp-bot:#C6CFD3;
  --surf:#C7D0D5; --surf-back:#9DA9AF; --wire:#63727A; --pt:#7E8C93;
  --grid:#B3BFC4; --key:#FFF6EA; --fill:#A8BAC3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171A; --panel:rgba(26,31,35,.84); --panel-solid:#1A1F23;
    --line:rgba(150,180,195,.15); --line-strong:rgba(150,180,195,.32);
    --text:#E2E7EA; --muted:#7C888F;
    --sel:#FFB020; --sel-hot:#FFC44D;
    --axX:#E5533D; --axY:#7CC93D; --axZ:#4A9BE8;
    --shadow:0 1px 2px rgba(0,0,0,.42), 0 12px 30px rgba(0,0,0,.48);
    --vp-top:#1E262B; --vp-bot:#0B0E11;
    --surf:#AEB8BE; --surf-back:#6E777D; --wire:#4E5A62; --pt:#8A979E;
    --grid:#232C32; --key:#FFF1DC; --fill:#33474F;
  }
}
:root[data-theme="dark"]{
  --bg:#14171A; --panel:rgba(26,31,35,.84); --panel-solid:#1A1F23;
  --line:rgba(150,180,195,.15); --line-strong:rgba(150,180,195,.32);
  --text:#E2E7EA; --muted:#7C888F;
  --sel:#FFB020; --sel-hot:#FFC44D;
  --axX:#E5533D; --axY:#7CC93D; --axZ:#4A9BE8;
  --shadow:0 1px 2px rgba(0,0,0,.42), 0 12px 30px rgba(0,0,0,.48);
  --vp-top:#1E262B; --vp-bot:#0B0E11;
  --surf:#AEB8BE; --surf-back:#6E777D; --wire:#4E5A62; --pt:#8A979E;
  --grid:#232C32; --key:#FFF1DC; --fill:#33474F;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
#stage{position:fixed;inset:0;touch-action:none;}
#gl{display:block;width:100%;height:100%;touch-action:none;}

.hud{position:fixed;z-index:2;pointer-events:none;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
          0 max(12px,env(safe-area-inset-left));}
.hud.tl{top:0;left:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.hud.tr{top:0;right:0;text-align:right;}

.stats{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  font-size:10px;font-variant-numeric:tabular-nums;line-height:1.5;color:var(--muted);}
.stats b{color:var(--text);font-weight:500;}

.group{pointer-events:auto;display:flex;gap:2px;padding:3px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);}

button{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 11px;min-height:34px;min-width:34px;cursor:pointer;white-space:nowrap;
  transition:background .13s ease,color .13s ease,border-color .13s ease;}
button:hover{color:var(--text);background:var(--line);}
button[aria-pressed="true"]{color:var(--text);background:var(--line);border-color:var(--line-strong);}
button:disabled{opacity:.34;cursor:default;}
button:disabled:hover{background:transparent;color:var(--muted);}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px;}
button.go{color:var(--text);}
button.go:not(:disabled):hover{background:var(--sel);color:#1A1206;}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom))
            max(12px,env(safe-area-inset-right));}
.card{pointer-events:auto;width:min(470px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  display:flex;flex-direction:column;}
.row{display:flex;gap:2px;padding:3px;align-items:center;}
.row + .row{border-top:1px solid var(--line);}
.row button{flex:1 1 0;}
.sep{width:1px;align-self:stretch;margin:5px 3px;background:var(--line);flex:0 0 auto;}

.amt{display:flex;align-items:center;gap:9px;padding:5px 11px 8px;}
.amt label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.amt output{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--text);min-width:3.6em;text-align:right;}
.amt input{flex:1 1 auto;}
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;margin:0;background:transparent;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:var(--line-strong);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;
  margin-top:-7.5px;border-radius:50%;background:var(--sel);border:2px solid var(--panel-solid);
  box-shadow:0 1px 3px rgba(0,0,0,.4);}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:var(--line-strong);border:none;}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--sel);
  border:2px solid var(--panel-solid);}
input[type=range]:focus-visible{outline:2px solid var(--sel);outline-offset:4px;border-radius:4px;}

.hint{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:10px;
  letter-spacing:.03em;color:var(--muted);text-align:center;max-width:44ch;
  transition:opacity .5s ease;}
.hint.gone{opacity:0;}
.mode-x{color:var(--axX);} .mode-y{color:var(--axY);} .mode-z{color:var(--axZ);}

#fallback{position:fixed;inset:0;z-index:9;display:none;place-content:center;padding:32px;
  text-align:center;background:var(--bg);}
#fallback.show{display:grid;}
#fallback strong{display:block;margin-bottom:10px;font-size:13px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;}
#fallback p{max-width:34ch;margin:0 auto;line-height:1.6;color:var(--muted);font-size:15px;}

/* ---- Kompaktstufe: Handy und Einbettung im Rahmen. Nur kleine Fenster,
   der Desktop bleibt wie er ist. ---- */
@media (max-width: 640px), (max-height: 460px){
  .stats, .hint{ display:none; }
  .hud{ padding:6px; }
  .group{ padding:2px; gap:1px; }
  .group button{ font-size:10px; min-height:26px; padding:4px 8px; }
  .dock{ padding-bottom:6px; }
  .card{ width:min(470px, calc(100vw - 12px)); }
  .row{ padding:2px; gap:1px; }
  .row button{ font-size:10px; min-height:26px; padding:3px 4px; letter-spacing:.02em; }
  .sep{ margin:3px 2px; }
  .amt{ padding:3px 8px 4px; gap:6px; }
  .amt label, .amt output{ font-size:9px; }
}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important;}}
</style>


<div id="stage"><canvas id="gl" aria-label="3D polygon modelling viewport"></canvas></div>

<div class="hud tl">
  <div class="group" role="group" aria-label="Sub-object level">
    <button id="mVert" type="button" aria-pressed="false">Vertex</button>
    <button id="mEdge" type="button" aria-pressed="false">Edge</button>
    <button id="mFace" type="button" aria-pressed="true">Face</button>
  </div>
</div>

<div class="hud tr">
  <div class="stats">
    <span id="sCount">6 faces</span><br>
    <span id="sSel">0 selected</span><br>
    <span id="sTopo">V8 E12 F6</span>
  </div>
</div>

<div class="dock">
  <p class="hint" id="hint">Tap to select &middot; drag empty space to orbit &middot; two fingers to pan</p>
  <div class="card">
    <div class="amt">
      <label for="kAmt">Amount</label>
      <input id="kAmt" type="range" min="0.05" max="1.2" step="0.05" value="0.4">
      <output id="vAmt">0.40</output>
    </div>
    <div class="row" role="group" aria-label="Transform tool">
      <button id="tSel" type="button" aria-pressed="true">Select</button>
      <button id="tMov" type="button" aria-pressed="false">Move</button>
      <button id="tRot" type="button" aria-pressed="false">Rotate</button>
      <button id="tScl" type="button" aria-pressed="false">Scale</button>
    </div>
    <div class="row" role="group" aria-label="Modelling operations">
      <button id="opExtrude" class="go" type="button">Extrude</button>
      <button id="opChamfer" class="go" type="button">Chamfer</button>
      <div class="sep"></div>
      <button id="opAll" type="button" title="Select all">All</button>
      <button id="opNone" type="button" title="Clear selection">None</button>
      <div class="sep"></div>
      <button id="opUndo" type="button" title="Undo">Undo</button>
      <button id="opRedo" type="button" title="Redo">Redo</button>
      <button id="opReset" type="button" title="Fresh box and default view">Reset</button>
    </div>
  </div>
</div>

<div id="fallback"><div>
  <strong>WebGPU unavailable</strong>
  <p id="fallbackMsg">This browser could not start a WebGPU context. Try Safari or Chrome with hardware acceleration enabled.</p>
</div></div>

<script>
"use strict";

/* -------------------------------------------- WebGPU-Start und Rückfall */
// Ohne WebGPU (oder bei einem Validierungsfehler beim Start) wird die
// WebGL-Fassung geladen; das Hinweis-Overlay bleibt für Geräteverlust.
function zeigeHinweis(text) {
  document.getElementById("fallbackMsg").textContent = text;
  document.getElementById("fallback").classList.add("show");
}
function rueckfall(grund) {
	console.error("WebGPU unavailable (" + grund + "), switching to the WebGL version");
	location.replace("webgl.html#fallback=" + encodeURIComponent(grund));
}
async function starteWebGPU(canvas) {
	if (!navigator.gpu) return rueckfall(window.isSecureContext ? "no navigator.gpu" : "insecure context, WebGPU needs https or localhost");
	var adapter = await navigator.gpu.requestAdapter();
	if (!adapter) return rueckfall("no adapter");
	var device = await adapter.requestDevice();
	device.addEventListener("uncapturederror", function (e) { console.error("WebGPU:", e.error.message); });
	device.lost.then(function (info) { if (info.reason !== "destroyed") zeigeHinweis("GPU device lost: " + info.message); });
	var context = canvas.getContext("webgpu");
	var format = navigator.gpu.getPreferredCanvasFormat();
	context.configure({ device: device, format: format, alphaMode: "opaque" });
	return { adapter: adapter, device: device, context: context, format: format };
}

(async function () {

/* ==========================================================================
   Editable-poly core.

   Canonical form is deliberately dumb: a position list and a list of faces
   holding vertex indices. Connectivity (half-edges, vertex fans) is derived
   on demand and thrown away. Operations therefore never patch adjacency in
   place - they emit a fresh canonical mesh, which keeps them independently
   testable and makes undo a snapshot.
   ========================================================================== */

/* <mesh-core> exported for tests/mesh.test.js; do not rename these markers */
function makeMesh(P, F) { return { P: P, F: F }; }

function boxMesh(sx, sy, sz) {
  var x = sx / 2, y = sy / 2, z = sz / 2;
  return makeMesh(
    [[-x,-y,-z],[ x,-y,-z],[ x, y,-z],[-x, y,-z],
     [-x,-y, z],[ x,-y, z],[ x, y, z],[-x, y, z]],
    // every face wound CCW seen from outside
    [[0,3,2,1], [4,5,6,7], [0,1,5,4], [3,7,6,2], [0,4,7,3], [1,2,6,5]]
  );
}

function cloneMesh(m) {
  return makeMesh(m.P.map(function (p) { return [p[0], p[1], p[2]]; }),
                  m.F.map(function (f) { return f.slice(); }));
}

/* ---------------------------------------------------------- vector helpers */
function sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function scale(a, s) { return [a[0]*s, a[1]*s, a[2]*s]; }
function cross(a, b) {
  return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
}
function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function len(a) { return Math.hypot(a[0], a[1], a[2]); }
function norm(a) { var l = len(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }

// Newell's method: correct for non-planar polygons, unlike a corner cross
function faceNormal(m, f) {
  var n = [0, 0, 0];
  for (var i = 0; i < f.length; i++) {
    var a = m.P[f[i]], b = m.P[f[(i + 1) % f.length]];
    n[0] += (a[1] - b[1]) * (a[2] + b[2]);
    n[1] += (a[2] - b[2]) * (a[0] + b[0]);
    n[2] += (a[0] - b[0]) * (a[1] + b[1]);
  }
  return n;                                   // unnormalised: length is 2*area
}
function faceCentroid(m, f) {
  var c = [0, 0, 0];
  for (var i = 0; i < f.length; i++) { c = add(c, m.P[f[i]]); }
  return scale(c, 1 / f.length);
}

/* ------------------------------------------------------------- connectivity */
function ekey(a, b) { return a < b ? a + "_" + b : b + "_" + a; }

function topology(m) {
  var he = [], map = new Map(), i, fi;
  for (fi = 0; fi < m.F.length; fi++) {
    var f = m.F[fi], n = f.length, base = he.length;
    for (i = 0; i < n; i++) {
      he.push({ a: f[i], b: f[(i + 1) % n], f: fi, c: i,
                next: base + ((i + 1) % n), twin: -1 });
      map.set(f[i] + "," + f[(i + 1) % n], base + i);
    }
  }
  for (i = 0; i < he.length; i++) {
    var t = map.get(he[i].b + "," + he[i].a);
    he[i].twin = (t === undefined) ? -1 : t;
  }
  var outgoing = new Map();                   // vertex -> outgoing half-edges
  for (i = 0; i < he.length; i++) {
    if (!outgoing.has(he[i].a)) outgoing.set(he[i].a, []);
    outgoing.get(he[i].a).push(i);
  }
  var edges = new Map();                      // "a_b" -> {a,b,faces:[...]}
  for (i = 0; i < he.length; i++) {
    var k = ekey(he[i].a, he[i].b);
    if (!edges.has(k)) edges.set(k, { a: Math.min(he[i].a, he[i].b),
                                      b: Math.max(he[i].a, he[i].b), he: [] });
    edges.get(k).he.push(i);
  }
  return { he: he, outgoing: outgoing, edges: edges };
}

// Ordered fan around v. Returns { E, Fc } where face Fc[i] lies between
// edges E[i-1] and E[i], cyclically. Closed manifold vertices only.
function vertexFan(m, T, v) {
  var start = T.outgoing.get(v);
  if (!start || !start.length) return null;
  var h0 = start[0], E = [], Fc = [], h = h0, guard = 0;
  do {
    E.push(h);
    Fc.push(T.he[h].f);
    var tw = T.he[h].twin;
    if (tw < 0) return null;                  // open boundary: not supported
    h = T.he[tw].next;
    if (++guard > 64) return null;
  } while (h !== h0);
  if (E.length !== start.length) return null; // non-manifold fan
  return { E: E, Fc: Fc };
}

function vertexFaces(m) {
  var vf = new Map(), fi, i;
  for (fi = 0; fi < m.F.length; fi++)
    for (i = 0; i < m.F[fi].length; i++) {
      var v = m.F[fi][i];
      if (!vf.has(v)) vf.set(v, []);
      if (vf.get(v).indexOf(fi) < 0) vf.get(v).push(fi);
    }
  return vf;
}

// drop unreferenced vertices and degenerate faces
// mapOut, when supplied, receives oldFaceIndex -> newFaceIndex so callers
// can keep hold of faces they created
function compact(m, mapOut) {
  var used = new Map(), P = [], F = [], i, j;
  for (i = 0; i < m.F.length; i++) {
    var f = m.F[i], out = [];
    for (j = 0; j < f.length; j++) {
      if (out.length && out[out.length - 1] === f[j]) continue;   // repeat
      out.push(f[j]);
    }
    while (out.length > 1 && out[0] === out[out.length - 1]) out.pop();
    if (out.length < 3) continue;
    for (j = 0; j < out.length; j++) {
      if (!used.has(out[j])) { used.set(out[j], P.length); P.push(m.P[out[j]]); }
      out[j] = used.get(out[j]);
    }
    if (mapOut) mapOut[i] = F.length;
    F.push(out);
  }
  return makeMesh(P, F);
}

/* ================================================================= EXTRUDE */
/* Vertices whose incident faces are ALL selected sit strictly inside the
   region and simply move. Everything on the rim is duplicated, so the
   original rim stays put to receive the side walls. */
function extrudeFaces(m, sel, dist) {
  if (!sel.length) return null;
  var T = topology(m), vf = vertexFaces(m);
  var isSel = new Set(sel);

  var N = [0, 0, 0], i, j;
  for (i = 0; i < sel.length; i++) N = add(N, faceNormal(m, m.F[sel[i]]));
  N = norm(N);
  if (!len(N)) return null;

  // collect rim half-edges from the ORIGINAL winding, before any rewrite
  var rim = [];
  for (i = 0; i < T.he.length; i++) {
    var h = T.he[i];
    if (!isSel.has(h.f)) continue;
    if (h.twin < 0 || !isSel.has(T.he[h.twin].f)) rim.push([h.a, h.b]);
  }

  var P = m.P.map(function (p) { return p.slice(); });
  var F = m.F.map(function (f) { return f.slice(); });
  var dup = new Map();

  var region = new Set();
  for (i = 0; i < sel.length; i++)
    for (j = 0; j < m.F[sel[i]].length; j++) region.add(m.F[sel[i]][j]);

  region.forEach(function (v) {
    var faces = vf.get(v) || [];
    var interior = faces.every(function (fi) { return isSel.has(fi); });
    if (interior) {
      P[v] = add(P[v], scale(N, dist));       // strictly inside: just move it
    } else {
      dup.set(v, P.length);
      P.push(add(m.P[v], scale(N, dist)));
    }
  });

  for (i = 0; i < sel.length; i++) {
    var f = F[sel[i]];
    for (j = 0; j < f.length; j++) if (dup.has(f[j])) f[j] = dup.get(f[j]);
  }

  var newFaces = [];
  for (i = 0; i < rim.length; i++) {
    var a = rim[i][0], b = rim[i][1];
    var ta = dup.has(a) ? dup.get(a) : a, tb = dup.has(b) ? dup.get(b) : b;
    F.push([a, b, tb, ta]);                   // outward: cross(b-a, N)
    newFaces.push(F.length - 1);
  }

  var out = makeMesh(P, F);
  // the extruded caps keep their indices; report them so they stay selected
  return { mesh: out, selection: sel.slice(), created: newFaces };
}

/* ================================================================= CHAMFER */
/* Cut the fan of faces around each affected vertex at every selected edge.

   With TWO OR MORE cuts, each arc between consecutive cuts collapses to one
   new vertex, placed by walking `amt` back along the two selected edges that
   bound the arc. Three or more cuts also leaves a hole, which gets a cap.

   With exactly ONE cut the fan opens into a path rather than splitting into
   arcs, and both ends of that path sit on the same edge. That needs two new
   vertices - one per adjacent face, offset perpendicular to the edge inside
   its own face - and every face between them has to carry BOTH, which is why
   a corner maps to a list rather than a single index.                     */
function chamferEdges(m, selEdges, amt) {
  if (!selEdges.length || amt <= 0) return null;
  var T = topology(m), i, j;

  var selSet = new Set();
  for (i = 0; i < selEdges.length; i++) selSet.add(ekey(selEdges[i][0], selEdges[i][1]));

  function edgeSelectedAt(v) {
    var og = T.outgoing.get(v) || [];
    for (var q = 0; q < og.length; q++)
      if (selSet.has(ekey(T.he[og[q]].a, T.he[og[q]].b))) return true;
    return false;
  }
  // never let a chamfer eat past the midpoint of any edge it touches
  var maxAmt = Infinity;
  T.edges.forEach(function (e, k) {
    if (selSet.has(k) || edgeSelectedAt(e.a) || edgeSelectedAt(e.b))
      maxAmt = Math.min(maxAmt, len(sub(m.P[e.a], m.P[e.b])) * 0.5);
  });
  amt = Math.min(amt, maxAmt * 0.98);
  if (!(amt > 1e-9)) return null;

  // Where a chamfered edge ends up inside one of its faces: the edge line,
  // shifted `amt` perpendicular to itself, in the plane of that face.
  function offsetLine(h, fi) {
    var d = norm(sub(m.P[T.he[h].b], m.P[T.he[h].a]));
    var inward = norm(cross(norm(faceNormal(m, m.F[fi])), d));
    return { p: add(m.P[T.he[h].a], scale(inward, amt)), d: d };
  }
  // Two such lines meet at the new corner. They can be skew when the arc is
  // not planar, so take the midpoint of the closest approach.
  function meet(L1, L2) {
    var c = cross(L1.d, L2.d), cc = dot(c, c);
    if (cc < 1e-12) return scale(add(L1.p, L2.p), 0.5);

    F.push(orient(P, quad, want));

    pass.draw(GR[a + 1] - GR[a], 1, GR[a], 0);
  }
  if (app.tool !== TOOL.ROTATE) {
    HP.length = 0; HS.length = 0;
    for (a = 0; a < 3; a++) {
      var h = add(pivot, scale(AX[a], L));
      HP.push(h[0], h[1], h[2]); HS.push(0);
    }
    HP.push(pivot[0], pivot[1], pivot[2]); HS.push(1);
    upload(B.hp, new Float32Array(HP)); upload(B.hs, new Float32Array(HS));
    pass.setPipeline(pPointTop);
    pass.setVertexBuffer(0, B.hp.buf); pass.setVertexBuffer(1, B.hs.buf);
    for (a = 0; a < 4; a++) {
      bind(pass, a === 3 ? SLOT.CENTRE : SLOT.HANDLE + a);
      pass.draw(6, 1, 0, a);                       // Instanz a = Griff a
    }
  }
}

function draw() {
  ensureTargets();
  schreibeUniforms();
  var enc = device.createCommandEncoder();
  var pass = enc.beginRenderPass({
    colorAttachments: [{ view: msaaView, resolveTarget: context.getCurrentTexture().createView(),
                         loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "discard" }],
    depthStencilAttachment: { view: depthView, depthLoadOp: "clear", depthClearValue: 1.0, depthStoreOp: "discard" }
  });

  // Himmel: Vollbild-Dreieck, kein Tiefentest, kein Tiefenschreiben
  bind(pass, SLOT.GRID);
  pass.setPipeline(pSky);
  pass.draw(3);

  // The grid plane cuts straight through a box centred on the origin, so it
  // must not write depth - otherwise it punches holes in the model's lower half.
  pass.setPipeline(pGrid);
  pass.setVertexBuffer(0, gridB.buf);
  pass.draw(gridN);

  // push fills back so the wireframe lands cleanly on the surface
  // (depthBias 1 / slope 1 in der Pipeline, wie polygonOffset(1,1))
  if (N.face) {
    pass.setPipeline(pFace);
    pass.setVertexBuffer(0, B.fp.buf); pass.setVertexBuffer(1, B.fn.buf); pass.setVertexBuffer(2, B.fs.buf);
    pass.draw(N.face);
  }

  if (N.wire) {
    pass.setPipeline(pWire);
    bind(pass, SLOT.WIRE);
    pass.setVertexBuffer(0, B.wp.buf);
    pass.draw(N.wire);
  }

  if (app.mode === MODE.EDGE && N.thick) {
    pass.setPipeline(pThickDepth);
    bind(pass, SLOT.THICK);
    pass.setVertexBuffer(0, B.tp.buf); pass.setVertexBuffer(1, B.to.buf); pass.setVertexBuffer(2, B.ts.buf);
    pass.draw(N.thick);
  }
  if (app.mode === MODE.VERT && N.point) {
    pass.setPipeline(pPointDepth);
    bind(pass, SLOT.POINT);
    pass.setVertexBuffer(0, B.pp.buf); pass.setVertexBuffer(1, B.ps.buf);
    pass.draw(6, N.point);                         // 6 Ecken je Punkt, ein Punkt je Instanz
  }
  drawGizmo(pass);
  pass.end();
  device.queue.submit([enc.finish()]);
}

/* ------------------------------------------------------------ operations */
function doExtrude() {
  if (app.mode !== MODE.FACE || !app.selF.size) return;
  var list = []; app.selF.forEach(function (f) { list.push(f); });
  pushUndo();
  var r = extrudeFaces(app.mesh, list, app.amount);
  if (!r) { app.undo.pop(); return; }
  app.mesh = r.mesh;
  app.selV.clear(); app.selE.clear();
  app.selF = new Set(r.selection);           // keep the cap live for another pass
  refresh();
}

function doChamfer() {
  var edges = [], T = app.topo;
  if (app.mode === MODE.EDGE) {
    app.selE.forEach(function (k) { var p = k.split("_"); edges.push([+p[0], +p[1]]); });
  } else if (app.mode === MODE.VERT) {
    // chamfering a vertex means chamfering every edge that meets it
    app.selV.forEach(function (v) {
      (T.outgoing.get(v) || []).forEach(function (h) {
        edges.push([T.he[h].a, T.he[h].b]);
      });
    });
  } else return;
  if (!edges.length) return;
  pushUndo();
  var r = chamferEdges(app.mesh, edges, app.amount);
  if (!r) { app.undo.pop(); return; }
  app.mesh = r.mesh;
  app.selV.clear(); app.selE.clear();
  app.selF = new Set(r.created);             // land in Face mode on the new faces
  app.mode = MODE.FACE;
  refresh();
}

function selectAll() {
  app.selV.clear(); app.selE.clear(); app.selF.clear();
  var i;
  if (app.mode === MODE.VERT) for (i = 0; i < app.mesh.P.length; i++) app.selV.add(i);
  else if (app.mode === MODE.FACE) for (i = 0; i < app.mesh.F.length; i++) app.selF.add(i);
  else app.topo.edges.forEach(function (e, k) { app.selE.add(k); });
  refresh();
}
function clearSelection() { app.selV.clear(); app.selE.clear(); app.selF.clear(); refresh(); }

/* ----------------------------------------------------------------- input */
var stage = document.getElementById("stage");
var hint = document.getElementById("hint");
var ptrs = new Map(), drag = null;

function pts() { var a = []; ptrs.forEach(function (p) { a.push(p); }); return a; }
function dismissHint() { if (hint && !hint.classList.contains("gone")) hint.classList.add("gone"); }

stage.addEventListener("pointerdown", function (e) {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
  if (ptrs.size === 1) {
    var h = gizmoHandleAt(e.clientX, e.clientY);
    if (h >= 0) { beginGizmo(h, e.clientX, e.clientY); drag = { kind: "giz" }; }
    else drag = { kind: "orbit", yaw: cam.yaw, pitch: cam.pitch,
                  sx: e.clientX, sy: e.clientY, moved: 0 };
  } else if (ptrs.size === 2) {
    var a = pts();
    drag = { kind: "pan", cx: (a[0].x + a[1].x) / 2, cy: (a[0].y + a[1].y) / 2,
             gap: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1,
             target: cam.target.slice(), dist: cam.dist };
  }
  e.preventDefault();
});

stage.addEventListener("pointermove", function (e) {
  if (!ptrs.has(e.pointerId) || !drag) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (drag.kind === "giz") { dragGizmo(e.clientX, e.clientY); dismissHint(); }
  else if (drag.kind === "orbit" && ptrs.size === 1) {
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    cam.yaw = drag.yaw + dx * 0.0075;
    cam.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch - dy * 0.0075));
    updateCamera();
  } else if (drag.kind === "pan" && ptrs.size === 2) {
    var a = pts();
    var cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
    var gap = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
    cam.dist = Math.max(1.2, Math.min(60, drag.dist * (drag.gap / gap)));
    userZoomed = true;
    var perPx = (2 * cam.dist * Math.tan(FOV * 0.5)) / cssH;
    cam.target = add(drag.target, add(scale(cam.right, -(cx - drag.cx) * perPx),
                                      scale(cam.up, (cy - drag.cy) * perPx)));
    updateCamera();
    dismissHint();
  }
  e.preventDefault();
});

function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && drag.kind === "orbit" && drag.moved < 6 && ptrs.size === 0) {
    toggleSelection(pickAt(e.clientX, e.clientY));   // a tap toggles membership
    dismissHint();
    refresh();
  }
  if (drag && drag.kind === "giz" && ptrs.size === 0) giz.axis = -1;
  if (!ptrs.size) drag = null;
  else if (ptrs.size === 1) {
    var a = pts()[0];
    drag = { kind: "orbit", yaw: cam.yaw, pitch: cam.pitch, sx: a.x, sy: a.y, moved: 99 };
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

stage.addEventListener("wheel", function (e) {
  cam.dist = Math.max(1.2, Math.min(60, cam.dist * (1 + Math.sign(e.deltaY) * 0.09)));
  userZoomed = true;
  updateCamera(); dismissHint(); e.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
["gesturestart","gesturechange","gestureend"].forEach(function (n) {
  document.addEventListener(n, function (e) { e.preventDefault(); });
});

/* -------------------------------------------------------------------- UI */
var modeBtns = [document.getElementById("mVert"), document.getElementById("mEdge"),
                document.getElementById("mFace")];
var toolBtns = [document.getElementById("tSel"), document.getElementById("tMov"),
                document.getElementById("tRot"), document.getElementById("tScl")];
var bExtrude = document.getElementById("opExtrude"), bChamfer = document.getElementById("opChamfer");
var bUndo = document.getElementById("opUndo"), bRedo = document.getElementById("opRedo");

modeBtns.forEach(function (b, i) {
  b.addEventListener("click", function () { app.mode = i; refresh(); });
});
toolBtns.forEach(function (b, i) {
  b.addEventListener("click", function () { app.tool = i; refresh(); });
});
bExtrude.addEventListener("click", doExtrude);
bChamfer.addEventListener("click", doChamfer);
document.getElementById("opAll").addEventListener("click", selectAll);
document.getElementById("opNone").addEventListener("click", clearSelection);
bUndo.addEventListener("click", function () {
  if (!app.undo.length) return;
  app.redo.push(snapshot()); restore(app.undo.pop());
});
bRedo.addEventListener("click", function () {
  if (!app.redo.length) return;
  app.undo.push(snapshot()); restore(app.redo.pop());
});
document.getElementById("opReset").addEventListener("click", function () {
  pushUndo();
  app.mesh = boxMesh(2, 2, 2);
  cam.yaw = -0.72; cam.pitch = 0.46; cam.target = [0, 0, 0];
  userZoomed = false; cam.dist = fitDistance();
  updateCamera();
  app.selV.clear(); app.selE.clear(); app.selF.clear();
  refresh();
});

var kAmt = document.getElementById("kAmt"), vAmt = document.getElementById("vAmt");
kAmt.addEventListener("input", function () {
  app.amount = parseFloat(kAmt.value); vAmt.textContent = app.amount.toFixed(2);
});

document.addEventListener("keydown", function (e) {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  var k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { (e.shiftKey ? bRedo : bUndo).click(); e.preventDefault(); return; }
  if (k === "1") { app.mode = MODE.VERT; refresh(); }
  else if (k === "2") { app.mode = MODE.EDGE; refresh(); }
  else if (k === "3") { app.mode = MODE.FACE; refresh(); }
  else if (k === "q") { app.tool = TOOL.SELECT; refresh(); }
  else if (k === "w") { app.tool = TOOL.MOVE; refresh(); }
  else if (k === "e") { app.tool = TOOL.ROTATE; refresh(); }
  else if (k === "r") { app.tool = TOOL.SCALE; refresh(); }
  else if (k === "a") selectAll();
  else return;
  e.preventDefault();
});

var sCount = document.getElementById("sCount"), sSel = document.getElementById("sSel"),
    sTopo = document.getElementById("sTopo");

function refresh() {
  rebuild();
  var m = app.mesh, n = selectionCount();
  var noun = app.mode === MODE.VERT ? "vert" : app.mode === MODE.EDGE ? "edge" : "face";
  sCount.textContent = m.F.length + (m.F.length === 1 ? " face" : " faces");
  sSel.textContent = n + " " + noun + (n === 1 ? "" : "s") + " selected";
  sTopo.innerHTML = "V<b>" + m.P.length + "</b> E<b>" + app.topo.edges.size +
                    "</b> F<b>" + m.F.length + "</b>";
  modeBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", i === app.mode ? "true" : "false"); });
  toolBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", i === app.tool ? "true" : "false"); });
  bExtrude.disabled = !(app.mode === MODE.FACE && n > 0);
  bChamfer.disabled = !(app.mode !== MODE.FACE && n > 0);
  bUndo.disabled = !app.undo.length;
  bRedo.disabled = !app.redo.length;
}

/* ------------------------------------------------------------------ loop */
function tick() {
  requestAnimationFrame(tick);
  if (verloren) return;                            // nach Geräteverlust nichts mehr zeichnen
  draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 220); });

resize();
refresh();
requestAnimationFrame(tick);

})().catch(function (e) {
  // Fehler beim Start (nicht zur Laufzeit): melden und die WebGL-Fassung laden
  console.error("WebGPU init failed:", e);
  rueckfall("init error");
});
</script>
